<text x="463" y="702" fill="#183a55" font-family="DejaVu Sans" font-size="21" font-weight="700">Autor</text>
<path d="M 446 715 H 804" stroke="#9eb2c2" stroke-width="1"/>
<text x="463" y="740" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7">- id, - nome, - nacionalidade</text>
<text x="463" y="764" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7">+ id / nome / nacionalidade</text>
<text x="463" y="788" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7">+ atribuirId(id)</text>
<text x="463" y="812" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7">ID não pode mudar livremente</text>
<rect x="845" y="650" width="360" height="170" rx="13" fill="#f6f5f2" stroke="#43617b" stroke-width="2"/>
<text x="863" y="676" fill="#536a80" font-family="DejaVu Sans" font-size="13">«tabela N:N»</text>
<text x="863" y="702" fill="#183a55" font-family="DejaVu Sans" font-size="21" font-weight="700">livros_autores</text>
