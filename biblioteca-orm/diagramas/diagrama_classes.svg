<text x="63" y="812" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7">+ id / titulo / autores</text>
<rect x="445" y="650" width="360" height="170" rx="13" fill="#e7f2ff" stroke="#43617b" stroke-width="2"/>
