<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="900" viewBox="0 0 1250 900">
<rect width="1250" height="900" fill="white"/>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="5" orient="auto"><path d="M 1,1 L 11,5 L 1,9" fill="none" stroke="#5a7388" stroke-width="1.6"/></marker><marker id="triangle" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M 1,1 L 13,7 L 1,13 Z" fill="white" stroke="#365267" stroke-width="1.7"/></marker></defs>
<text x="50" y="45" font-size="29" font-weight="700" font-family="DejaVu Sans" fill="#16334b">Diagrama UML de classes — BibliotecaORM</text>
<text x="50" y="71" font-size="14" font-family="DejaVu Sans" fill="#5a7181">Data Mapper simplificado: PHP puro, PDO, MySQL 8 • responsabilidades de domínio e infraestrutura</text>
<rect x="45" y="100" width="360" height="198" rx="13" fill="#fff4d7" stroke="#43617b" stroke-width="2"/>
<text x="63" y="126" fill="#536a80" font-family="DejaVu Sans" font-size="13">«interface»</text>
<text x="63" y="152" fill="#183a55" font-family="DejaVu Sans" font-size="21" font-weight="700">RepositoryInterface</text>
<path d="M 46 165 H 404" stroke="#9eb2c2" stroke-width="1"/>
<text x="63" y="190" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7">+ buscar(id: int): ?object</text>
<text x="63" y="214" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7">+ listar(): array</text>
<text x="63" y="238" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7">+ salvar(entidade: object): void</text>
<text x="63" y="262" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7">+ excluir(id: int): void</text>
<rect x="445" y="100" width="360" height="198" rx="13" fill="#eee9ff" stroke="#43617b" stroke-width="2"/>
<text x="463" y="126" fill="#536a80" font-family="DejaVu Sans" font-size="13">«abstract»</text>
<text x="463" y="152" fill="#183a55" font-family="DejaVu Sans" font-size="21" font-weight="700">AbstractRepository</text>
