<text x="863" y="788" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7">PK composta (livro_id, autor_id)</text>
<text x="863" y="812" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7">impede vínculo duplicado</text>
