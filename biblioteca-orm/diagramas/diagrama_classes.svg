<text x="463" y="466" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7"># tabela(): string</text>
<text x="463" y="490" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7"> # hidratar(linha): Autor</text>
<text x="463" y="514" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7"> # extrair(entidade): array</text>
<text x="463" y="538" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7"> # identidade / definirIdentidade</text>
<rect x="845" y="376" width="360" height="195" rx="13" fill="#eaf7eb" stroke="#43617b" stroke-width="2"/>
<text x="863" y="402" fill="#536a80" font-family="DejaVu Sans" font-size="13">«serviço consumidor»</text>
<text x="863" y="428" fill="#183a55" font-family="DejaVu Sans" font-size="21" font-weight="700">ConsultaPolimorfica</text>
<path d="M 846 441 H 1204" stroke="#9eb2c2" stroke-width="1"/>
<text x="863" y="466" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7">+ buscar(repo: RepositoryInterface,</text>
<text x="863" y="490" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7">             id: int): ?object</text>
