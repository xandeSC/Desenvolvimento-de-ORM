<text x="463" y="190" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7"># pdo: PDO</text>
<text x="463" y="214" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7">+ buscar / listar / salvar / excluir</text>
<text x="463" y="238" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7"> # tabela / colunas / hidratar / extrair</text>
<text x="463" y="262" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7"> # identidade / definirIdentidade</text>
<rect x="845" y="100" width="360" height="198" rx="13" fill="#edf4f8" stroke="#43617b" stroke-width="2"/>
<text x="863" y="126" fill="#536a80" font-family="DejaVu Sans" font-size="13">«infraestrutura»</text>
<text x="863" y="152" fill="#183a55" font-family="DejaVu Sans" font-size="21" font-weight="700">Conexao</text>
<path d="M 846 165 H 1204" stroke="#9eb2c2" stroke-width="1"/>
<text x="863" y="190" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7">+ abrir(): PDO</text>
<text x="863" y="214" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7">usa variáveis de ambiente</text>
<text x="863" y="238" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7">ERRMODE_EXCEPTION</text>
<text x="863" y="262" fill="#253b4b" font-family="DejaVu Sans Mono" font-size="12.7">ATTR_EMULATE_PREPARES = false</text>
<rect x="45" y="376" width="360" height="195" rx="13" fill="#f2f7fc" stroke="#43617b" stroke-width="2"/>
<text x="63" y="402" fill="#536a80" font-family="DejaVu Sans" font-size="13">«classe concreta»</text>
<text x="63" y="428" fill="#183a55" font-family="DejaVu Sans" font-size="21" font-weight="700">LivroRepository</text>
